<h1>Scoped Events</h1><p>This example demonstrates <code>pub()</code>, <code>on()</code>, and <code>off()</code> for runtime event publication and subscriptions alongside template-time <code>.sub()</code>.</p><div id="App"><div class="App"><div class="controls"><button type="button">Add Counter</button><button type="button">Clear Log</button></div><div><div class="Counter counter"><button type="button">−</button><span class="value">5</span><button type="button">+</button></div><div class="Counter counter"><button type="button">−</button><span class="value">3</span><button type="button">+</button></div><div class="Counter counter"><button type="button">−</button><span class="value">0</span><button type="button">+</button></div></div><h3>Event Log</h3><div class="event-log"></div></div></div><template id="Counter"><div class="counter"><button type="button" on:click="decrement">−</button><span class="value" out="count">0</span><button type="button" on:click="increment">+</button></div></template><template id="App"><div><div class="controls"><button type="button" on:click="addCounter">Add Counter</button><button type="button" on:click="clearLog">Clear Log</button></div><div out="counters"></div><h3>Event Log</h3><div class="event-log" out="log"></div></div></template>
