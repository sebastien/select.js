<h1>Event Assign</h1><p><code>on:event="@slot"</code> writes the changed value back into local component state.</p><div id="ui"><div class="EventAssign demo"><section class="row"><label> Top-level cell via <code>on:change="@hexcolor"</code><input type="color" value="#336699"></label><div class="swatch"></div><code>#336699</code></section><section class="row"><label> Nested plain prop via <code>on:input="@form.hexcolor"</code><input type="text" value="#ff6600"></label><div class="swatch"></div><code>#ff6600</code></section><section class="row"><label> Nested write into reactive object via <code>on:input="@palette.accent"</code><input type="text" value="#a855f7"></label><div class="swatch"></div><code>#a855f7</code></section></div></div><template id="EventAssign"><div class="demo"><section class="row"><label> Top-level cell via <code>on:change="@hexcolor"</code><input type="color" on:change="@hexcolor" out:value="hexcolor"></label><div class="swatch" out:style="hexcolor|colorStyle"></div><code out="hexcolor"></code></section><section class="row"><label> Nested plain prop via <code>on:input="@form.hexcolor"</code><input type="text" on:input="@form.hexcolor" out:value="form.hexcolor"></label><div class="swatch" out:style="form.hexcolor|colorStyle"></div><code out="form.hexcolor"></code></section><section class="row"><label> Nested write into reactive object via <code>on:input="@palette.accent"</code><input type="text" on:input="@palette.accent" out:value="palette.accent"></label><div class="swatch" out:style="palette.accent|colorStyle"></div><code out="palette.accent"></code></section></div></template>
